name: safebank-agent

x-backend-base: &backend-base
  image: safebank-agent-backend:${APP_IMAGE_TAG:-latest}
  build:
    context: .
    dockerfile: backend/Dockerfile
  env_file:
    - ${APP_ENV_FILE:-.env.production}
  networks:
    - app-network
  init: true
  read_only: true
  tmpfs:
    - /tmp:size=64m,mode=1777
  security_opt:
    - no-new-privileges:true
  cap_drop:
    - ALL

services:
  config-check:
    <<: *backend-base
    env_file:
      - ${APP_ENV_FILE:-.env.production}
      - ${MYSQL_ENV_FILE:-.env.mysql}
    environment:
      APP_DOMAIN: ${APP_DOMAIN:-:80}
    command: ["python", "-m", "scripts.validate_deployment_config"]
    restart: "no"
    mem_limit: 256m
    cpus: 0.25
    pids_limit: 100

  mysql:
    image: mysql:8.4
    restart: unless-stopped
    env_file:
      - ${MYSQL_ENV_FILE:-.env.mysql}
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_0900_ai_ci
      - --innodb-buffer-pool-size=268435456
      - --max-connections=80
      - --table-open-cache=400
      - --performance-schema=OFF
    volumes:
      - mysql-data:/var/lib/mysql
    networks:
      - app-network
    mem_limit: 900m
    cpus: 0.75
    pids_limit: 300
    security_opt:
      - no-new-privileges:true
    depends_on:
      config-check:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot --password=\"$${MYSQL_ROOT_PASSWORD}\" --silent"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 30s

  migrate:
    <<: *backend-base
    command: ["python", "-m", "alembic", "upgrade", "head"]
    restart: "no"
    mem_limit: 512m
    cpus: 0.5
    pids_limit: 150
    depends_on:
      config-check:
        condition: service_completed_successfully
      mysql:
        condition: service_healthy

  api:
    <<: *backend-base
    restart: unless-stopped
    command:
      - python
      - -m
      - uvicorn
      - backend.app.main:app
      - --host
      - 0.0.0.0
      - --port
      - "8000"
      - --proxy-headers
      - --forwarded-allow-ips=*
      - --timeout-keep-alive
      - "30"
    expose:
      - "8000"
    mem_limit: 700m
    cpus: 1.0
    pids_limit: 250
    depends_on:
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/health', timeout=3).read()"
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 20s

  feishu-worker:
    <<: *backend-base
    restart: unless-stopped
    command: ["python", "-m", "backend.app.integrations.feishu_long_connection"]
    mem_limit: 400m
    cpus: 0.5
    pids_limit: 200
    depends_on:
      api:
        condition: service_healthy

  radar-worker:
    <<: *backend-base
    restart: unless-stopped
    command: ["python", "-m", "backend.app.integrations.life_event_radar_worker"]
    mem_limit: 400m
    cpus: 0.5
    pids_limit: 200
    depends_on:
      api:
        condition: service_healthy

  frontend:
    image: safebank-agent-frontend:${APP_IMAGE_TAG:-latest}
    build:
      context: frontend
      dockerfile: Dockerfile
    restart: unless-stopped
    expose:
      - "80"
    networks:
      - app-network
    mem_limit: 128m
    cpus: 0.25
    pids_limit: 100
    security_opt:
      - no-new-privileges:true
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1/nginx-health"]
      interval: 15s
      timeout: 3s
      retries: 5
      start_period: 5s

  gateway:
    image: caddy:2.8-alpine
    restart: unless-stopped
    environment:
      APP_DOMAIN: ${APP_DOMAIN:-:80}
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    networks:
      - app-network
    mem_limit: 128m
    cpus: 0.25
    pids_limit: 100
    security_opt:
      - no-new-privileges:true
    depends_on:
      api:
        condition: service_healthy
      frontend:
        condition: service_healthy

networks:
  app-network:
    driver: bridge

volumes:
  mysql-data:
  caddy-data:
  caddy-config:
